[project]
name = "multiome"
version = "0.1.0"
description = "Multiplex network medicine for gene groups — informed multiplex random walk with restart. Python reimplementation of Buphamalai et al., Nat Commun 2021."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
networkx = ["networkx>=3.2"]
dev = [
    "networkx>=3.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
multiome = "multiome_algo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiome_core", "src/multiome_algo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
